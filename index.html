<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <aside id="menu-lateral" class="sidebar">
        <div class="sidebar-header p-3 text-white border-bottom border-secondary border-opacity-25">
            <h5 class="m-0"><i class="bi bi-person-badge-fill me-2"></i>Sistema</h5>
        </div>
        <ul class="nav nav-pills flex-column p-2">
            <li class="nav-item">
                <a class="nav-link text-white dropdown-toggle" href="#sub-menu-usuarios" data-bs-toggle="collapse" role="button" aria-expanded="false">
                    <i class="bi bi-people-fill me-2"></i>Usuarios</a>
                <div class="collapse ps-3" id="sub-menu-usuarios">
                  <ul class="nav flex-column">
                    <li class="nav-item">
                      <a class="nav-link text-white-50 active" href="#">
                        <i class="bi bi-file-earmark-plus me-2"></i>Captura
                      </a>
                    </li>
                  </ul>
                </div>
            </li>
        </ul>
    </aside>
    <div id="contenido-principal" class="main-content">
        <nav class="navbar navbar-expand-lg px-3 shadow-sm">
            <button id="boton-hamburguesa" class="boton-outline-light me-3" type="button" aria-label="Menú lateral">
                <i class="bi bi-list fs-5"></i>
            </button>
            <span class="navbar-brand me-auto" style="color: #2d2b3a; font-weight: 600;">Panel de control</span>
            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle rounded-pill" type="button" id="menu-desplegable-usuario" data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-person-circle me-1" style="color: #c6b2eb;"></i>
                  <span id="nombre-usuario-navbar">Cargando...</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" aria-labelledby="menu-desplegable-usuario">
                  <li>
                    <button class="dropdown-item text-danger" id="boton-cerrar-sesion" type="button">
                      <i class="bi bi-box-arrow-right me-2"></i>Salir del sistema
                    </button>
                  </li>
                </ul>
            </div>
        </nav>
        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                  <div class="card shadow-sm border-0">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="bi bi-journal-plus me-2"></i>Captura de Usuarios</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="formulario-usuario" novalidate>
                            <div class="mb-3">
                                <label for="nombre-usuario" class="form-label fw-semibold">Nombre del Usuario</label>
                                <input type="text" class="form-control rounded-3" id="nombre-usuario" placeholder="Ej. Evelin Pablo">
                            </div>
                            <div class="mb-3">
                                <label for="correo-usuario" class="form-label fw-semibold">Correo electrónico</label>
                                <input type="email" class="form-control rounded-3" id="correo-usuario" placeholder="Ej. username@correo.com">
                            </div>
                            <div class="mb-3">
                                <label for="contraseña-usuario" class="form-label fw-semibold">Contraseña</label>
                                <input type="password" class="form-control rounded-3" id="contraseña-usuario" placeholder="Minimo 8 caracteres">
                            </div>
                            <div class="mb-3">
                                <label for="numero-control" class="form-label fw-semibold">Número de control</label>
                                <input type="text" class="form-control rounded-3" id="numero-control" placeholder="23161064" maxlength="7">
                            </div>
                            <div class="mb-3">
                                <label for="edad-usuario" class="form-label fw-semibold">Edad</label>
                                <input type="number" class="form-control rounded-3" id="edad-usuario" placeholder="20">
                            </div>
                            <div id="mensaje-error" class="text-danger mb-3 fw-bold" role="alert"></div>
                            <button type="submit" class="boton-primario w-100">Guardar Registro</button>
                        </form>
                    </div>
                  </div>  
                </div>
            </div>
        </main>
    </div>
    <div class="modal fade" id="modal-edad" tabindex="-1" aria-labelledby="etiqueta-modal-edad" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fw-bold" id="etiqueta-modal-edad">
                <i class="bi bi-info-circle me-2"></i>Verificación de Edad
              </h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body text-center py-4" id="contenido-modal-edad">
            </div>
            <div class="modal-footer border-0">
              <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Aceptar</button>
            </div>
          </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utileria.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
