<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina">

  <main>
    <h1 class="titulo-principal">Inicio de sesión</h1>

    <section class="tarjeta" aria-labelledby="titulo-tarjeta">
      <div class="avatar" aria-hidden="true">
        <i class="bi bi-person-fill text-white fs-1"></i>
      </div>
      <h2 id="titulo-tarjeta" class="visually-hidden">Accede con tu cuenta</h2>

      <form id="formLogin" novalidate>
        <div class="campo">
          <i class="bi bi-person-fill campo-icono" aria-hidden="true"></i>
          <label for="correo" class="visually-hidden">Correo electrónico</label>
          <input type="email" id="correo" class="campo-input" placeholder="Correo electrónico" autocomplete="username">
        </div>

        <div class="campo">
          <i class="bi bi-lock-fill campo-icono" aria-hidden="true"></i>
          <label for="password" class="visually-hidden">Contraseña</label>
          <input type="password" id="password" class="campo-input" placeholder="Contraseña" autocomplete="current-password">
        </div>

        <p id="error" class="mensaje-error" role="alert"></p>

        <button type="submit" class="boton-login">Iniciar sesión</button>

        <div class="fila-opciones">
          <div class="form-check m-0">
            <input class="form-check-input" type="checkbox" id="recordar">
            <label class="form-check-label" for="recordar">Recordarme</label>
          </div>
          <a href="#" id="olvide" class="enlace-olvide">¿Olvidaste tu contraseña?</a>
        </div>
      </form>

      <div class="separador"><span>o continúa con</span></div>

      <div class="redes">
        <a class="boton-red" href="https://accounts.google.com/" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-google" aria-hidden="true"></i> Google
        </a>
        <a class="boton-red" href="https://www.facebook.com/login/" target="_blank" rel="noopener noreferrer">
          <i class="bi bi-facebook" aria-hidden="true"></i> Facebook
        </a>
      </div>
    </section>
  </main>

  <script src="js/utileria.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
